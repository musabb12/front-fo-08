name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cms:cms@localhost:5432/cms
      CMS_ADMIN_USERNAME: SD-Developer
      CMS_ADMIN_PASSWORD: ci-admin-password-secure-32chars
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-fo-08/package-lock.json

      - name: Install
        working-directory: front-fo-08
        run: npm ci

      - name: Migrate database
        working-directory: front-fo-08
        run: npm run db:migrate

      - name: Test
        working-directory: front-fo-08
        run: npm test

      - name: Typecheck
        working-directory: front-fo-08
        run: npx tsc --noEmit

      - name: Build
        working-directory: front-fo-08
        run: npm run build
